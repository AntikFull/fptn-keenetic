# Адрес туннельного интерфейса. Одно и то же значение получают клиент
# (--tun-interface-ip) и ndm — расхождение ломает обратный трафик.
# Менять есть смысл, если 10.0.0.0/24 уже занята другим интерфейсом роутера
# (например, WireGuard-подключением) — тогда подойдёт 172.31.254.1.
# После смены нужно переустановить пакет: адрес переназначается и в ndm.
TUN_ADDRESS="10.0.0.1"
